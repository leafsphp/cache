app:
    - ./src

tests:
    engine: pest
    suites:
        "Test Suite":
            paths:
                - ./tests
            files:
                - "*.test.php"

lint:
    preset: PSR12

actions:
    os:
        - ubuntu-latest
    run:
        - lint
        - tests
    php:
        versions:
            - "8.2"
            - "8.3"
            - "8.4"
    events:
        - push
        - pull_request
